<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Keymap Layers · JIS</title>
  <style>
    /* Gruvbox Material (dark medium) */
    :root {
      --bg0: #1d2021;
      --bg1: #282828;
      --bg2: #32302f;
      --bg3: #45403d;
      --bg4: #5a524c;
      --fg0: #d4be98;
      --fg1: #ddc7a1;
      --grey0: #7c6f64;
      --grey1: #928374;
      --grey2: #a89984;
      --red: #ea6962;
      --orange: #e78a4e;
      --yellow: #d8a657;
      --green: #a9b665;
      --aqua: #89b482;
      --blue: #7daea3;
      --purple: #d3869b;
      --unit: 34px;
      --gap: 4px;
      --key-h: 32px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: transparent !important;
      width: max-content;
    }
    body {
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Helvetica Neue", sans-serif;
      color: var(--fg0);
      -webkit-font-smoothing: antialiased;
    }
    .shell {
      margin: 0;
      padding: 20px 22px 16px;
      background: linear-gradient(
        180deg,
        rgba(40, 40, 40, 0.82) 0%,
        rgba(29, 32, 33, 0.78) 100%
      );
      -webkit-backdrop-filter: blur(18px) saturate(1.2);
      backdrop-filter: blur(18px) saturate(1.2);
      border: 1px solid rgba(212, 190, 152, 0.12);
      border-radius: 18px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.45), inset 0 1px 0 rgba(212,190,152,0.08);
      min-width: 0;
      width: max-content;
      max-width: 1280px;
      opacity: 0;
      transform: translateY(8px) scale(0.985);
      animation: rise 160ms ease-out forwards;
    }
    @keyframes rise {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }
    h1 {
      margin: 0;
      font-size: 17px;
      letter-spacing: 0.01em;
      color: var(--yellow);
      font-weight: 700;
    }
    .sub { color: var(--grey1); font-size: 12px; }
    .layers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto;
      gap: 10px;
      align-items: start;
    }
    .board {
      background: rgba(50, 48, 47, 0.55);
      border: 1px solid rgba(60, 56, 54, 0.8);
      border-radius: 12px;
      padding: 10px 10px 10px;
      box-shadow: inset 0 1px 0 rgba(212,190,152,0.04);
      min-width: 0;
      overflow: hidden;
    }
    .board.active {
      border-color: rgba(216, 166, 87, 0.45);
      box-shadow: inset 0 0 0 1px rgba(216, 166, 87, 0.12), inset 0 1px 0 rgba(212,190,152,0.04);
    }
    .board-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      min-width: 0;
    }
    .board-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--fg1);
      white-space: nowrap;
      flex: 0 0 auto;
    }
    .board.active .board-title { color: var(--yellow); }
    .board-summary {
      color: var(--grey1);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      text-align: right;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .keyboard {
      display: grid;
      gap: var(--gap);
      justify-content: center;
      padding: 2px 0 4px;
      position: relative;
    }
    .row {
      display: flex;
      gap: var(--gap);
      justify-content: flex-start;
      align-items: flex-start;
      min-height: var(--key-h);
      height: var(--key-h);
    }
    .key {
      position: relative;
      height: var(--key-h);
      width: var(--unit);
      padding: 3px 4px 4px;
      border-radius: 7px;
      background: linear-gradient(180deg, #45403d 0%, #3c3836 100%);
      border: 1px solid #1d2021;
      box-shadow: inset 0 1px 0 rgba(212,190,152,0.1), 0 1px 2px rgba(0,0,0,0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 650;
      font-size: 11px;
      color: var(--fg0);
      flex: 0 0 auto;
      overflow: hidden;
    }
    .key.holder {
      background: linear-gradient(180deg, #c35e0a 0%, #a04300 100%);
      border-color: rgba(231, 138, 78, 0.45);
      color: #1d2021;
    }
    .key.mapped {
      background: linear-gradient(180deg, #6f8250 0%, #556340 100%);
      border-color: rgba(169, 182, 101, 0.4);
      color: #1d2021;
    }
    .key.shifted {
      background: linear-gradient(180deg, #5a524c 0%, #45403d 100%);
      border-color: rgba(168, 153, 132, 0.35);
      color: var(--fg0);
    }
    .key.shifted .action { color: var(--fg0); }
    .key.dead {
      background: #000;
      border-color: #000;
      box-shadow: none;
      color: transparent;
    }
    .key.dead .shift,
    .key.dead .base,
    .key.dead .action,
    .key.dead .kana,
    .key.dead .glyph,
    .key.dead .word { display: none; }
    .key .shift {
      position: absolute;
      top: 3px;
      right: 5px;
      font-size: 9px;
      font-weight: 600;
      color: var(--grey2);
      opacity: 0.95;
    }
    .key.holder .shift,
    .key.mapped .shift { color: rgba(29,32,33,0.7); }
    .key .base {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .key .action {
      color: var(--bg0);
      font-size: 11px;
      font-weight: 750;
      margin-top: 1px;
    }
    .key .kana {
      position: absolute;
      left: 5px;
      bottom: 3px;
      font-size: 9px;
      font-weight: 500;
      color: var(--grey1);
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    }
    .key.holder .kana,
    .key.mapped .kana { color: rgba(29,32,33,0.65); }
    .key.mod {
      font-size: 10px;
      color: var(--grey2);
    }
    /*
      Apple 公式 JIS return（258×340 px 実測）:
      上段フル幅、下段は左 ~19% 欠け。巨大なせり出しはしない。
    */
    .key.jis-return {
      width: calc(var(--unit) * 1.72);
      height: calc(var(--key-h) * 2 + var(--gap));
      margin-bottom: calc(-1 * (var(--key-h) + var(--gap)));
      background: transparent;
      border: none;
      box-shadow: none;
      overflow: visible;
      z-index: 1;
      padding: 0;
    }
    .key.jis-return .return-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 1px 1px rgba(0,0,0,0.45));
      overflow: visible;
    }
    .key.jis-return .glyph {
      position: absolute;
      right: 11px;
      top: 10px;
      z-index: 2;
      font-size: 14px;
      font-weight: 500;
      color: var(--fg0);
      line-height: 1;
      pointer-events: none;
    }
    .key.jis-return .word {
      position: absolute;
      right: 10px;
      bottom: 9px;
      z-index: 2;
      font-size: 9px;
      font-weight: 650;
      color: var(--grey2);
      letter-spacing: 0.02em;
      pointer-events: none;
    }
    .key.jis-return .action {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 2;
      margin: 0;
      font-size: 14px;
      font-weight: 750;
      color: var(--fg0);
      line-height: 1;
      pointer-events: none;
    }
    .key.jis-return.mapped .action {
      color: #1d2021;
    }
    .key.jis-return.shifted .action {
      color: var(--fg0);
    }
    .key.bracket-close {
      z-index: 3;
      position: relative;
    }
    .arrows {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 3px;
      width: calc(var(--unit) * 3.05);
      height: var(--key-h);
    }
    .arrows .ak {
      border-radius: 5px;
      background: linear-gradient(180deg, #45403d 0%, #3c3836 100%);
      border: 1px solid #1d2021;
      box-shadow: inset 0 1px 0 rgba(212,190,152,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--fg0);
      font-size: 9px;
      font-weight: 700;
    }
    .arrows .up { grid-column: 2; grid-row: 1; }
    .arrows .left { grid-column: 1; grid-row: 2; }
    .arrows .down { grid-column: 2; grid-row: 2; }
    .arrows .right { grid-column: 3; grid-row: 2; }
    .legend {
      margin-top: 10px;
      display: flex;
      gap: 14px;
      justify-content: flex-end;
      color: var(--grey1);
      font-size: 11px;
    }
    /* JISの6層を3段で表示する場合も、キーと凡例を表示枠に収める。 */
    .jis-keymap-compact {
      --key-h: 25px;
    }
    .jis-keymap-compact .key { padding: 0 2px; line-height: 1; }
    .jis-keymap-compact .key .base { font-size: 8px; }
    .jis-keymap-compact .key .action { font-size: 9px; }
    .jis-keymap-compact .key[data-long-label] { padding-inline: 0; }
    .jis-keymap-compact .key[data-long-label] .action {
      font-size: 7px;
      font-family: Menlo, monospace;
      max-width: 100%;
      overflow-wrap: anywhere;
      text-align: center;
    }
    .jis-keymap-compact .key .shift { top: 1px; }
    .jis-keymap-compact .key .kana { bottom: 1px; }
    .swatch {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 3px;
      margin-right: 6px;
      vertical-align: -1px;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.35);
    }
    .swatch.holder { background: #a04300; }
    .swatch.mapped { background: #556340; }
    .swatch.shifted { background: #5a524c; }
    .swatch.dead { background: #000; border: 1px solid #333; }
    .swatch.normal { background: #3c3836; }
    /* 分割配列はキーの座標を保ち、レイヤー数が多い場合も全体が画面の幅と高さに収まるようにする。 */
    .torabo-keymap .shell { width: min(1240px, 100vw); }
    .torabo-keymap .layers {
      grid-template-columns: repeat(var(--torabo-columns), minmax(0, 1fr));
      grid-template-rows: none;
      --torabo-board-width: calc((min(1240px, 100vw) - 46px - (var(--torabo-columns) - 1) * 10px) / var(--torabo-columns) - 22px);
      --torabo-board-height: calc((100vh - 76px - (var(--torabo-rows) - 1) * 10px) / var(--torabo-rows) - 50px);
      --torabo-unit: min(34px, calc(var(--torabo-board-width) / var(--torabo-width)), calc(var(--torabo-board-height) / var(--torabo-height)));
    }
    .torabo-geometry {
      position: relative;
      margin: 0 auto;
      width: calc(var(--torabo-unit) * var(--torabo-width));
      height: calc(var(--torabo-unit) * var(--torabo-height));
    }
    .torabo-geometry .key {
      position: absolute;
      left: calc(var(--torabo-unit) * var(--key-x));
      top: calc(var(--torabo-unit) * var(--key-y));
      width: calc(var(--torabo-unit) - 2px);
      height: calc(var(--torabo-unit) - 2px);
      padding: 1px 2px;
      border-radius: 4px;
      white-space: pre-line;
      text-align: center;
      overflow-wrap: anywhere;
      line-height: 1.05;
      font-size: clamp(8px, calc(var(--torabo-unit) * 0.32), 11px);
    }
    .torabo-geometry .key[data-long-label] { font-size: clamp(7px, calc(var(--torabo-unit) * 0.28), 9px); }
  </style>
</head>
<body>
  <div class="shell">
    <div class="header">
      <h1 id="keymap-title">Keymap Layers · JIS shape / US legends</h1>
      <div class="sub" id="keymap-sub">f + b で表示 · 離すと閉じる · Gruvbox Material</div>
    </div>
    <div class="layers" id="layers"></div>
  </div>
  <script>
    function widthStyle(units) {
      return `width: calc(var(--unit) * ${Number(units || 1)});`;
    }

    function displayName(key, def) {
      return (def.key_labels && def.key_labels[key]) || key;
    }

    function createArrowCluster() {
      const wrap = document.createElement("div");
      wrap.className = "arrows";
      wrap.innerHTML = `
        <div class="ak up">▲</div>
        <div class="ak left">◀</div>
        <div class="ak down">▼</div>
        <div class="ak right">▶</div>
      `;
      return wrap;
    }

    function isDeadBinding(value) {
      return value === "∅" || value === "" || value === null;
    }

    function baseDeadKeys(def) {
      const base = (def.layers || []).find((layer) => layer.id === "base");
      const dead = new Set();
      if (!base || !base.bindings) return dead;
      for (const [key, value] of Object.entries(base.bindings)) {
        if (isDeadBinding(value)) dead.add(key);
      }
      return dead;
    }

    function baseBindings(def) {
      const base = (def.layers || []).find((layer) => layer.id === "base");
      return (base && base.bindings) || {};
    }

    function createKey(key, layer, def, options = {}) {
      if (key === "arrow_cluster") return createArrowCluster();

      const bindings = layer.bindings || {};
      const isHoldLayer = layer.id !== "base";
      const hideUnassigned = isHoldLayer && !options.external;
      const isHoldKey = key === (layer.hold || layer.id);
      const layerMapped = Object.prototype.hasOwnProperty.call(bindings, key) ? bindings[key] : undefined;
      const baseMapped = baseBindings(def)[key];
      const fromLayer = layerMapped !== undefined && !isDeadBinding(layerMapped);
      const fromBaseShift = !fromLayer && baseMapped !== undefined && !isDeadBinding(baseMapped);

      // 押し込み中: レイヤー割当 → 移動後のみ。出力なし・未割当・押し込みキー自体は文字なし。
      let mapped;
      let dead = false;
      if (fromLayer) {
        mapped = layerMapped;
      } else if (isHoldKey) {
        mapped = undefined;
      } else if (baseDeadKeys(def).has(key) || isDeadBinding(baseMapped)) {
        dead = true;
      } else if (fromBaseShift) {
        mapped = baseMapped;
      } else if (hideUnassigned) {
        dead = true;
      } else {
        mapped = undefined;
      }

      const keyEl = document.createElement("div");
      keyEl.className = "key";
      keyEl.style.cssText = widthStyle((def.key_widths && def.key_widths[key]) || 1);
      if (options.jisReturn) keyEl.classList.add("jis-return");
      if (key === "]") keyEl.classList.add("bracket-close");
      if (key === "space") keyEl.classList.add("space");
      if (isHoldKey) keyEl.classList.add("holder");
      if (dead) {
        keyEl.classList.add("dead");
        if (options.jisReturn) {
          keyEl.style.background = "#000";
          keyEl.replaceChildren();
        }
        return keyEl;
      }
      if (mapped) keyEl.classList.add(fromLayer || layer.id === "base" ? "mapped" : "shifted");

      const mods = new Set([
        "esc", "delete", "tab", "control", "shift_l", "shift_r", "return",
        "caps", "option_l", "option_r", "command_l", "command_r",
        "eisuu", "kana", "fn", "space"
      ]);
      if (mods.has(key)) keyEl.classList.add("mod");

      const glyph = def.key_glyphs && def.key_glyphs[key];
      if (options.jisReturn) {
        // Apple JIS return: top full-width, bottom left inset ~19% (official asset ratio).
        const gid = `retGrad-${layer.id}-${Math.random().toString(36).slice(2, 7)}`;
        const layered = fromLayer || layer.id === "base";
        const fillTop = mapped ? (layered ? "#6f8250" : "#5a524c") : "#45403d";
        const fillBot = mapped ? (layered ? "#556340" : "#45403d") : "#3c3836";
        keyEl.innerHTML = `
          <svg class="return-svg" viewBox="0 0 100 132" preserveAspectRatio="none" aria-hidden="true">
            <defs>
              <linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="${fillTop}"/>
                <stop offset="100%" stop-color="${fillBot}"/>
              </linearGradient>
            </defs>
            <path fill="url(#${gid})" stroke="#1d2021" stroke-width="1.2" stroke-linejoin="round"
              d="M 5.5 1
                 H 94.5
                 Q 99 1 99 5.5
                 V 126.5
                 Q 99 131 94.5 131
                 H 24
                 Q 19 131 19 126.5
                 V 66
                 H 5.5
                 Q 1 66 1 61.5
                 V 5.5
                 Q 1 1 5.5 1
                 Z"/>
            <path fill="none" stroke="rgba(212,190,152,0.14)" stroke-width="1"
              d="M 6 2.2 H 94 Q 97.5 2.2 97.5 5.5 V 8"/>
          </svg>`;
        if (mapped) {
          const action = document.createElement("div");
          action.className = "action";
          action.textContent = mapped;
          keyEl.appendChild(action);
        } else if (!hideUnassigned) {
          const action = document.createElement("div");
          action.className = "action";
          action.textContent = glyph || "↩";
          keyEl.appendChild(action);
        }
        return keyEl;
      }

      // 移動後の出力（またはレイヤー割り当て）だけを表示する
      if (mapped) {
        const action = document.createElement("div");
        action.className = "action";
        action.textContent = mapped;
        if (mapped.length > 8) keyEl.dataset.longLabel = "";
        keyEl.appendChild(action);
      } else if (!hideUnassigned && key !== "space") {
        const name = displayName(key, def);
        if (!name && !glyph) {
          keyEl.style.visibility = "hidden";
          return keyEl;
        }
        const label = document.createElement("div");
        // glyph と label が同じ（⌫⌫ など）にならないよう一つだけ出す
        if (glyph && name && glyph !== name && key !== "eisuu" && key !== "kana" && key !== "fn") {
          label.textContent = glyph;
          label.style.fontSize = "10px";
        } else {
          label.textContent = glyph || name;
        }
        keyEl.appendChild(label);
      }
      return keyEl;
    }

    function renderLayer(layer, def, external) {
      const bindings = layer.bindings || {};
      const summaryEntries = Object.keys(bindings)
        .filter((key) => !isDeadBinding(bindings[key]))
        .sort()
        .map((key) => `${displayName(key, def)}→${bindings[key]}`);
      const summary = summaryEntries.length === 0
        ? "JIS 形状 · US 刻印"
        : summaryEntries.join("   ");
      const board = createBoard(`${layer.name}  ·  ${layer.trigger}`, summary, Boolean(layer.hold));

      const keyboard = document.createElement("div");
      keyboard.className = "keyboard";
      def.rows.forEach((row, rowIndex) => {
        const rowEl = document.createElement("div");
        rowEl.className = "row";
        const extras = (def.row_extras && def.row_extras[String(rowIndex)]) || [];
        for (const key of row) {
          rowEl.appendChild(createKey(key, layer, def, { external }));
          for (const extra of extras) {
            if (extra.after === key && !extra.placeholder) {
              rowEl.appendChild(createKey(extra.key, layer, def, { external, jisReturn: extra.key === "return" }));
            }
          }
        }
        keyboard.appendChild(rowEl);
      });
      board.appendChild(keyboard);

      const legend = document.createElement("div");
      legend.className = "legend";
      legend.innerHTML = `
        <span><i class="swatch holder"></i>レイヤーキー</span>
        <span><i class="swatch mapped"></i>レイヤー割当</span>
        <span><i class="swatch shifted"></i>移動後</span>
        <span><i class="swatch dead"></i>出力なし</span>
        <span><i class="swatch normal"></i>通常</span>
      `;
      board.appendChild(legend);
      return board;
    }

    // 常駐処理から表示する配列を受け取り、現在の画面を差し替える。
    function showKeymap(profile, externalLayers) {
      const root = document.getElementById("layers");
      const title = document.querySelector("#keymap-title");
      const sub = document.querySelector("#keymap-sub");
      const jis = window.__KEYMAP_LAYERS__;
      const external = profile === "external" && Array.isArray(externalLayers) && externalLayers.length > 0;
      const def = external ? { ...jis, layers: externalLayers } : jis;
      const split = profile === "torabo" ? window.__TORABO_KEYMAP__ : null;
      const useSplit = Boolean(split && Array.isArray(split.keys) && split.keys.length &&
        split.keys.every((key) => key && Number.isFinite(key.x) && Number.isFinite(key.y)) &&
        Array.isArray(split.layers) && split.layers.length && split.layers.every((layer) => layer && typeof layer.name === "string"));
      document.body.classList.toggle("torabo-keymap", useSplit);
      document.body.classList.toggle("jis-keymap-compact", !useSplit && def?.layers?.length > 4);
      root.replaceChildren();
      if (useSplit) {
        title.textContent = split.name || "Torabo-tsuki (S)";
        if (sub) {
          const battery = window.__TORABO_BATTERY_SUBTITLE__ || "";
          sub.textContent = battery
            ? `${battery} · f + b で表示 · 離すと閉じる`
            : "f + b で表示 · 離すと閉じる · 電池取得中";
        }
        renderToraboKeymap(root, split);
        return "torabo";
      }
      if (!def) throw new Error("JISの配列データがありません。");
      title.textContent = external ? "外付けキーボード · JIS 配列" : "内蔵キーボード · JIS 配列";
      if (sub) sub.textContent = external ? "f + b で表示 · 離すと閉じる" : "物理 e + f で表示 · 離すと閉じる";
      for (const layer of def.layers) root.appendChild(renderLayer(layer, def, external));
      return external ? "external" : "jis";
    }

    function renderToraboKeymap(root, definition) {
      const horizontal = definition.keys.map((key) => key.x);
      const vertical = definition.keys.map((key) => key.y);
      const left = Math.min(...horizontal);
      const top = Math.min(...vertical);
      const columns = Math.min(4, Math.ceil(Math.sqrt(definition.layers.length)));
      root.style.setProperty("--torabo-columns", String(columns));
      root.style.setProperty("--torabo-rows", String(Math.ceil(definition.layers.length / columns)));
      root.style.setProperty("--torabo-width", String(Math.max(...horizontal) - left + 1));
      root.style.setProperty("--torabo-height", String(Math.max(...vertical) - top + 1));
      const base = definition.layers[0].bindings || {};
      for (const layer of definition.layers) root.appendChild(renderToraboLayer(layer, definition, { left, top, base }));
    }

    function renderToraboLayer(layer, definition, layout) {
      const board = createBoard(layer.name, layer.summary || definition.summary || "");
      const keyboard = document.createElement("div");
      keyboard.className = "torabo-geometry";
      const bindings = layer.bindings || {};
      for (const key of definition.keys) {
        const keyEl = document.createElement("div");
        keyEl.className = "key";
        const label = bindings[key.id] ?? key.label ?? "";
        keyEl.textContent = label;
        keyEl.title = label;
        if (label.length > 4) keyEl.dataset.longLabel = "";
        if (label && label !== (layout.base[key.id] ?? key.label ?? "")) keyEl.classList.add("mapped");
        keyEl.style.setProperty("--key-x", String(key.x - layout.left));
        keyEl.style.setProperty("--key-y", String(key.y - layout.top));
        keyboard.appendChild(keyEl);
      }
      board.appendChild(keyboard);
      return board;
    }

    // どちらの配列も同じタイトルと補足の表示枠を組み立てる。
    function createBoard(titleText, summaryText, active = false) {
      const board = document.createElement("section");
      board.className = active ? "board active" : "board";
      const head = document.createElement("div");
      head.className = "board-head";
      const title = document.createElement("div");
      title.className = "board-title";
      title.textContent = titleText;
      const summary = document.createElement("div");
      summary.className = "board-summary";
      summary.textContent = summaryText;
      head.appendChild(title);
      head.appendChild(summary);
      board.appendChild(head);
      return board;
    }

    window.showKeymap = showKeymap;
    try { showKeymap("jis"); }
    catch (error) {
      const message = document.createElement("pre");
      message.style.cssText = "color:#ea6962;padding:24px";
      message.textContent = `キー一覧を読み込めませんでした。${error.message}`;
      document.body.replaceChildren(message);
    }
  </script>
</body>
</html>
